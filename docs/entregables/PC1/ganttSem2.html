<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gantt estimado – Semestre 2 | EOGo</title>
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --text:#202437;
    --muted:#72788c;
    --grid:#e6e8ef;
    --phase:#3e3a69;
    --bar:#665f99;
    --bar2:#8b84bb;
    --accent:#d3a92e;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  .page{
    width:min(1800px, 98vw);
    margin:22px auto;
    background:var(--card);
    border-radius:18px;
    box-shadow:0 10px 35px rgba(25,30,55,.10);
    overflow:hidden;
  }

  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:24px 28px 18px;
    border-bottom:1px solid var(--grid);
  }

  h1{
    margin:0;
    font-size:28px;
    line-height:1.15;
  }

  .subtitle{
    margin-top:6px;
    color:var(--muted);
    font-size:14px;
  }

  button{
    border:0;
    background:var(--phase);
    color:white;
    padding:11px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
    white-space:nowrap;
  }

  .wrap{
    overflow-x:auto;
    padding:0 0 20px;
  }

  .gantt{
    min-width:1450px;
    display:grid;
    grid-template-columns: 390px repeat(24, minmax(42px, 1fr));
    grid-auto-rows:minmax(44px, auto);
    position:relative;
  }

  .cell{
    border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
    min-height:44px;
  }

  .left-head{
    grid-column:1;
    grid-row:1 / span 2;
    padding:16px 18px;
    font-weight:700;
    display:flex;
    align-items:center;
    border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
    background:#fafbfe;
  }

  .month{
    padding:10px 4px 7px;
    text-align:center;
    font-weight:700;
    background:#fafbfe;
    border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
  }

  .week{
    text-align:center;
    padding:8px 2px;
    color:var(--muted);
    font-size:11px;
    background:#fcfcfe;
    border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
  }

  .label{
    grid-column:1;
    padding:10px 14px;
    border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
    line-height:1.25;
    min-height:52px;
    display:flex;
    align-items:center;
    gap:9px;
    background:white;
    overflow-wrap:anywhere;
  }

  .label strong{font-size:13px}
  .label span{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
  }

  .num{
    min-width:28px;
    height:28px;
    border-radius:8px;
    display:grid;
    place-items:center;
    background:#efeff7;
    color:var(--phase);
    font-size:12px;
    font-weight:700;
  }

  .phase-label{
    grid-column:1 / -1;
    padding:10px 16px;
    background:var(--phase);
    color:white;
    font-weight:700;
    letter-spacing:.15px;
    border-bottom:2px solid white;
  }

  .gridline{
    border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
    min-height:52px;
  }

  .bar{
    align-self:center;
    height:24px;
    margin:0 4px;
    border-radius:7px;
    background:var(--bar);
    color:#fff;
    font-size:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 7px;
    overflow:hidden;
    white-space:nowrap;
    z-index:2;
    box-shadow:0 2px 7px rgba(55,50,95,.20);
  }

  .bar.continuous{ background:var(--bar2); }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    padding:16px 28px 22px;
    color:var(--muted);
    font-size:12px;
  }
  .key{display:flex;align-items:center;gap:7px}
  .swatch{width:18px;height:10px;border-radius:4px;background:var(--bar)}
  .swatch.cont{background:var(--bar2)}

  @media print{
    @page{size:A3 landscape; margin:9mm;}
    body{background:white}
    .page{
      width:100%;
      margin:0;
      box-shadow:none;
      border-radius:0;
    }
    button{display:none}
    .wrap{overflow:visible}
    .gantt{min-width:0}
    h1{font-size:21px}
  }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <h1>Diagrama de Gantt estimado — Semestre 2</h1>
      <div class="subtitle">Proyecto EOGo · 18 de enero al 1 de julio de 2027 · estimación inicial</div>
    </div>
    <button onclick="window.print()">Guardar / Imprimir PDF</button>
  </div>

  <div class="wrap">
    <div class="gantt" id="gantt"></div>
  </div>

  <div class="legend">
    <div class="key"><div class="swatch"></div>Actividad principal</div>
    <div class="key"><div class="swatch cont"></div>Actividad continua / transversal</div>
  </div>
</div>

<script>
const semesterStart = new Date("2027-01-18T00:00:00");
const semesterEnd   = new Date("2027-07-01T00:00:00");

// 24 bloques semanales aproximados para mantener el Gantt legible.
const weeks = [];
let w = new Date(semesterStart);
for(let i=0;i<24;i++){
  let end = new Date(w);
  end.setDate(end.getDate()+6);
  weeks.push({start:new Date(w), end});
  w.setDate(w.getDate()+7);
}

const phases = [
  {
    name:"FASE 1 · Integración de adquisición y procesamiento EOG",
    tasks:[
      {n:1, name:"Revisión y ajuste del sistema de adquisición EOG", dates:"18 ene – 29 ene", start:"2027-01-18", end:"2027-01-29"},
      {n:2, name:"Diseño, simulación y fabricación del acondicionamiento analógico / PCB", dates:"18 ene – 12 feb", start:"2027-01-18", end:"2027-02-12"},
      {n:3, name:"Algoritmo de clasificación de comandos EOG", dates:"1 feb – 5 mar", start:"2027-02-01", end:"2027-03-05"},
      {n:4, name:"Comunicación Python ↔ microcontrolador y máquina de estados", dates:"22 feb – 12 mar", start:"2027-02-22", end:"2027-03-12"}
    ]
  },
  {
    name:"FASE 2 · Motorización y control de potencia",
    tasks:[
      {n:5, name:"Diseño mecánico de adaptación para motores y transmisión", dates:"1 mar – 26 mar", start:"2027-03-01", end:"2027-03-26"},
      {n:6, name:"Montaje de motores, acoples y estructura en la silla", dates:"22 mar – 9 abr", start:"2027-03-22", end:"2027-04-09"},
      {n:7, name:"Etapa de potencia, alimentación y control PWM", dates:"5 abr – 23 abr", start:"2027-04-05", end:"2027-04-23"},
      {n:8, name:"Pruebas de movimiento manual: avance, reversa, giros y frenado", dates:"19 abr – 30 abr", start:"2027-04-19", end:"2027-04-30"}
    ]
  },
  {
    name:"FASE 3 · Seguridad mecatrónica e integración completa",
    tasks:[
      {n:9, name:"Integración de sensores ultrasónicos y lógica de parada", dates:"19 abr – 7 may", start:"2027-04-19", end:"2027-05-07"},
      {n:10, name:"Pruebas de detección de obstáculos y ajuste de distancias", dates:"3 may – 14 may", start:"2027-05-03", end:"2027-05-14"},
      {n:11, name:"Integración EOG + microcontrolador + motores + seguridad", dates:"10 may – 28 may", start:"2027-05-10", end:"2027-05-28"}
    ]
  },
  {
    name:"FASE 4 · Validación, resultados y cierre",
    tasks:[
      {n:12, name:"Pruebas funcionales controladas del prototipo completo", dates:"31 may – 11 jun", start:"2027-05-31", end:"2027-06-11"},
      {n:13, name:"Validación y resultados: precisión, latencia, seguridad y repetibilidad", dates:"7 jun – 25 jun", start:"2027-06-07", end:"2027-06-25"},
      {n:14, name:"Correcciones finales y preparación de demostración", dates:"21 jun – 1 jul", start:"2027-06-21", end:"2027-07-01"},
      {n:15, name:"Documentación final y evidencias del proyecto", dates:"18 ene – 1 jul", start:"2027-01-18", end:"2027-07-01", continuous:true}
    ]
  }
];

const gantt = document.getElementById("gantt");

// Cabecera izquierda
const lh = document.createElement("div");
lh.className="left-head";
lh.textContent="Actividad";
gantt.appendChild(lh);

// Cabecera mensual calculada sobre los 24 bloques
const monthGroups = [];
let current = null;
weeks.forEach((wk, idx)=>{
  const d = new Date(wk.start);
  const key = `${d.getFullYear()}-${d.getMonth()}`;
  const name = d.toLocaleDateString("es-MX",{month:"long"});
  if(!current || current.key!==key){
    current={key,name,start:idx+2,count:1};
    monthGroups.push(current);
  }else current.count++;
});

monthGroups.forEach(m=>{
  const el=document.createElement("div");
  el.className="month";
  el.style.gridColumn=`${m.start} / span ${m.count}`;
  el.style.gridRow="1";
  el.textContent=m.name.charAt(0).toUpperCase()+m.name.slice(1);
  gantt.appendChild(el);
});

// semanas
weeks.forEach((wk,i)=>{
  const el=document.createElement("div");
  el.className="week";
  el.style.gridColumn=String(i+2);
  el.style.gridRow="2";
  const s=wk.start.toLocaleDateString("es-MX",{day:"2-digit",month:"short"});
  el.textContent=s.replace(".","");
  gantt.appendChild(el);
});

let row=3;

function weekIndex(dateStr, isEnd=false){
  const d=new Date(dateStr+"T00:00:00");
  for(let i=0;i<weeks.length;i++){
    if(d>=weeks[i].start && d<=weeks[i].end) return i;
  }
  if(d<weeks[0].start) return 0;
  return weeks.length-1;
}

phases.forEach(phase=>{
  const p=document.createElement("div");
  p.className="phase-label";
  p.style.gridRow=String(row);
  p.textContent=phase.name;
  gantt.appendChild(p);
  row++;

  phase.tasks.forEach(t=>{
    // etiqueta
    const label=document.createElement("div");
    label.className="label";
    label.style.gridRow=String(row);
    label.innerHTML=`<div class="num">${t.n}</div><div><strong>${t.name}</strong><span>${t.dates}</span></div>`;
    gantt.appendChild(label);

    // cuadrícula
    for(let i=0;i<24;i++){
      const c=document.createElement("div");
      c.className="gridline";
      c.style.gridColumn=String(i+2);
      c.style.gridRow=String(row);
      gantt.appendChild(c);
    }

    // barra
    const s=weekIndex(t.start);
    const e=weekIndex(t.end,true);
    const bar=document.createElement("div");
    bar.className="bar"+(t.continuous?" continuous":"");
    bar.style.gridColumn=`${s+2} / ${e+3}`;
    bar.style.gridRow=String(row);
    bar.title=`${t.name}: ${t.dates}`;
    bar.textContent=t.dates;
    gantt.appendChild(bar);

    row++;
  });
});
</script>
</body>
</html>
